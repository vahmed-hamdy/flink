version: '3.8'

services:
  zookeeper:
#    image: wurstmeister/zookeeper:3.4.6
    image: zookeeper:3.6.3
    ports:
      - "2181:2181"
    networks:
      - rpc-network

  server-0:
    image: flink-rpc-handson:latest
    ports:
      - "9127:9127"
    environment:
      - PROGRAM_NAME=server
      - SERVER_URL=server-0
      - SERVER_PORT=9127
      - CLIENT_URL=client
      - CLIENT_PORT=9125
      - ZOOKEEPER_ADDRESS=zookeeper:2181
      - ZOOKEEPER_ENABLE=true
    networks:
      - rpc-network
    volumes:
      - /Users/ahmedhamdy/flink/flink/flink-rpc-handson/src/opt:/tmp
    depends_on:
      - zookeeper

  server-1:
    image: flink-rpc-handson:latest
    ports:
      - "9129:9129"
    environment:
      - PROGRAM_NAME=server
      - SERVER_URL=server-1
      - SERVER_PORT=9129
      - CLIENT_URL=client
      - CLIENT_PORT=9125
      - ZOOKEEPER_ADDRESS=zookeeper:2181
      - ZOOKEEPER_ENABLE=true
    networks:
      - rpc-network
    volumes:
      - /Users/ahmedhamdy/flink/flink/flink-rpc-handson/src/opt:/tmp
    depends_on:
      - zookeeper


  client:
    image: flink-rpc-handson:latest
    ports:
      - "9125:9125"
    environment:
      - PROGRAM_NAME=client
#      - SERVER_URL=server
#      - SERVER_PORT=9127
      - CLIENT_URL=client
      - CLIENT_PORT=9125
      - ZOOKEEPER_ADDRESS=zookeeper:2181
      - ZOOKEEPER_ENABLE=true
    volumes:
      - /Users/ahmedhamdy/flink/flink/flink-rpc-handson/src/opt:/tmp

    networks:
      - rpc-network
    depends_on:
        - zookeeper


networks:
    rpc-network:
        driver: bridge
